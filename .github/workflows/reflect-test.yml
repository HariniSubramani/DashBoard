name: Run Reflect Tests on PR
 
on:
  pull_request:
    branches: [main]
 
jobs:
  reflect-tests:
    runs-on: ubuntu-latest
 
    steps:
      - name: Trigger Reflect Test Suite
        run: |
          curl -X POST \
          https://api.reflect.run/v1/suites/FdBvEpouJM9lz7dxXJZBMa6GQDJKJKYk6X4k5ADi/executions 
            -H "X-API-KEY: ${{ secrets.REFLECT_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "gitHub": {
                "owner": "'"${{ github.repository_owner }}"'",
                "repo": "'"${{ github.event.repository.name }}"'",
                "sha": "'"${{ github.event.pull_request.head.sha }}"'"
              }
            }' \
